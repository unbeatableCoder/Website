<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Jogos</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--borda:#262b36;--txt:#e6e6e6;--sec:#9aa3b2;--acc:#3b82f6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--borda);padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:1.3rem;cursor:pointer}
#pesquisa{flex:1;min-width:160px;padding:10px 12px;border-radius:8px;border:1px solid var(--borda);background:var(--card);color:var(--txt);font-size:1rem}
main{max-width:1000px;margin:0 auto;padding:20px 16px}
h2.sec{font-size:1.1rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.jogo{background:var(--card);border:1px solid var(--borda);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.jogo:hover{transform:translateY(-3px);border-color:var(--acc)}
.capa{width:100%;aspect-ratio:16/9;object-fit:cover;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#7c3aed);color:#fff;font-size:2rem;font-weight:700}
.jogo .info{padding:10px 12px}
.jogo h3{margin:0 0 4px;font-size:.98rem}
.jogo small{color:var(--sec)}
.vazio{text-align:center;color:var(--sec);padding:40px 0}
.voltar{background:none;border:0;color:var(--acc);cursor:pointer;font-size:1rem;padding:0 0 14px}
.detalhe{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media(min-width:720px){.detalhe{grid-template-columns:320px 1fr}}
.detalhe .capa{border-radius:12px;aspect-ratio:16/9}
.painel{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:18px}
.painel h1{margin:0 0 8px;font-size:1.5rem}
.painel p{color:var(--sec);line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{font-size:.78rem;background:#1f2937;color:#93c5fd;padding:4px 9px;border-radius:6px}
.stats{display:flex;gap:18px;color:var(--sec);font-size:.9rem;margin:10px 0 16px}
.stats b{color:var(--txt)}
.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;border:0;padding:12px 18px;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600}
.secao{margin-top:20px}
.secao h3{margin:0 0 8px;font-size:1rem}
ul.regras{margin:0;padding-left:20px;color:var(--sec);line-height:1.6}
</style>
</head>
<body>
<header>
  <h1 id="logo">Roblox Jogos</h1>
  <input id="pesquisa" type="search" placeholder="Pesquisar jogo...">
</header>

<main id="app"></main>

<script>
// Adiciona jogos copiando um bloco. "capa" pode ser um link de imagem.
// "placeId" é o número que aparece no URL do jogo no Roblox (roblox.com/games/NUMERO).
const jogos = [
  {
    id: "exemplo-obby",
    nome: "Obby Exemplo",
    placeId: 0,
    capa: "",
    criador: "Teu Nome",
    descricao: "Um obby de saltos com checkpoints e níveis cada vez mais difíceis.",
    categorias: ["Obby", "Aventura"],
    jogadores: 1200,
    visitas: 54000,
    atualizado: "2026-10-01",
    regras: ["Salta de plataforma em plataforma", "Chegas a um checkpoint a cada nível", "Cuidado com as armadilhas"]
  },
  {
    id: "exemplo-tycoon",
    nome: "Tycoon Exemplo",
    placeId: 0,
    capa: "",
    criador: "Outro Criador",
    descricao: "Constrói a tua fábrica, compra máquinas e aumenta o lucro.",
    categorias: ["Tycoon", "Economia"],
    jogadores: 800,
    visitas: 32000,
    atualizado: "2026-09-15",
    regras: ["Ganha dinheiro com cliques", "Compra novas máquinas", "Desbloqueia áreas novas"]
  }
];

const app = document.getElementById("app");
const pesquisa = document.getElementById("pesquisa");
let termo = "";

// Capa: usa a imagem se existir, senão mostra um bloco com as iniciais
function capaHTML(j) {
  if (j.capa) return `<img class="capa" src="${j.capa}" alt="">`;
  const iniciais = j.nome.split(" ").slice(0, 2).map(p => p[0]).join("").toUpperCase();
  return `<div class="capa">${iniciais}</div>`;
}

function formatar(n) {
  return n.toLocaleString("pt-PT");
}

function mostrarLista() {
  const t = termo.toLowerCase();
  const lista = jogos.filter(j =>
    (j.nome + " " + j.criador + " " + j.categorias.join(" ")).toLowerCase().includes(t)
  );

  app.innerHTML = `<h2 class="sec">Jogos</h2><div class="grid"></div>`;
  const grid = app.querySelector(".grid");

  if (lista.length === 0) {
    app.innerHTML = `<div class="vazio">Nenhum jogo encontrado.</div>`;
    return;
  }

  lista.forEach(j => {
    const c = document.createElement("div");
    c.className = "jogo";
    c.innerHTML = `${capaHTML(j)}<div class="info"><h3></h3><small></small></div>`;
    c.querySelector("h3").textContent = j.nome;
    c.querySelector("small").textContent = j.criador + " · " + formatar(j.jogadores) + " jogando";
    c.onclick = () => location.hash = "#/jogo/" + j.id;
    grid.appendChild(c);
  });
}

function mostrarJogo(id) {
  const j = jogos.find(x => x.id === id);
  if (!j) return location.hash = "";

  app.innerHTML = `
    <button class="voltar">← Voltar</button>
    <div class="detalhe">
      <div>${capaHTML(j)}</div>
      <div class="painel">
        <h1></h1>
        <small style="color:var(--sec)"></small>
        <div class="stats"></div>
        <p class="desc"></p>
        <div class="tags"></div>
        <a class="btn" target="_blank" rel="noopener">Jogar no Roblox</a>
        <div class="secao">
          <h3>Como jogar</h3>
          <ul class="regras"></ul>
        </div>
      </div>
    </div>`;

  app.querySelector(".voltar").onclick = () => location.hash = "";
  app.querySelector("h1").textContent = j.nome;
  app.querySelector("small").textContent = "por " + j.criador + " · atualizado em " + j.atualizado;
  app.querySelector(".stats").innerHTML =
    `<span><b>${formatar(j.jogadores)}</b> a jogar</span><span><b>${formatar(j.visitas)}</b> visitas</span>`;
  app.querySelector(".desc").textContent = j.descricao;

  const tags = app.querySelector(".tags");
  j.categorias.forEach(c => {
    const s = document.createElement("span");
    s.className = "tag";
    s.textContent = c;
    tags.appendChild(s);
  });

  const btn = app.querySelector(".btn");
  if (j.placeId) btn.href = "https://www.roblox.com/games/" + j.placeId;
  else btn.style.display = "none";

  const ul = app.querySelector(".regras");
  j.regras.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r;
    ul.appendChild(li);
  });

  window.scrollTo(0, 0);
}

function render() {
  const partes = location.hash.split("/");
  if (partes[1] === "jogo" && partes[2]) mostrarJogo(partes[2]);
  else mostrarLista();
}

pesquisa.addEventListener("input", e => {
  termo = e.target.value;
  if (location.hash) location.hash = "";
  else mostrarLista();
});
document.getElementById("logo").onclick = () => location.hash = "";
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
